<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/admin-layout :: layout(~{::section})}"><body><section class="catalog-page">
<div class="admin-heading"><div><span class="eyebrow">THIẾT LẬP HÀNG HÓA</span><h1 th:text="${lookupTitle}"></h1><p class="admin-description">Dữ liệu đang được sử dụng sẽ được giữ lại khi có yêu cầu xóa.</p></div><a class="btn btn-primary" th:href="@{/admin/{kind}/create(kind=${kind})}" th:text="'Thêm '+${lookupTitle.toLowerCase()}"></a></div>
<div class="admin-panel"><div class="table-wrap"><table class="admin-table"><thead><tr><th>ID</th><th th:text="${lookupTitle}"></th><th th:if="${kind=='categories'}">Trạng thái</th><th>Hành động</th></tr></thead><tbody>
<tr th:each="item:${items}"><td th:text="${item.id}"></td><td th:text="${kind=='sizes' ? item.sizeValue : item.name}"></td><td th:if="${kind=='categories'}" th:text="${item.status == true ? 'Đang hoạt động' : 'Ngừng hoạt động'}"></td><td><div class="catalog-actions"><a th:href="@{/admin/{kind}/edit/{id}(kind=${kind},id=${item.id})}">Sửa</a><form th:action="@{/admin/{kind}/delete/{id}(kind=${kind},id=${item.id})}" method="post" novalidate data-delete-form><button class="btn-link-danger" type="button" data-delete th:attr="data-object=${kind=='sizes' ? item.sizeValue : item.name}" data-consequence="Chỉ xóa khi chưa được tham chiếu. Không thể khôi phục bản ghi đã xóa.">Xóa</button></form></div></td></tr>
<tr th:if="${items.empty}"><td colspan="4" class="catalog-empty">Chưa có dữ liệu. Chọn nút Thêm để tạo bản ghi đầu tiên.</td></tr></tbody></table></div>
<nav class="catalog-pagination" aria-label="Phân trang"><span th:text="${items.totalElements}+' bản ghi · Trang '+${items.number+1}"></span><div><a th:if="${items.hasPrevious()}" class="btn btn-outline-secondary btn-sm" th:href="@{/admin/{kind}(kind=${kind},page=${items.number-1})}">Trang trước</a><a th:if="${items.hasNext()}" class="btn btn-outline-secondary btn-sm" th:href="@{/admin/{kind}(kind=${kind},page=${items.number+1})}">Trang sau</a></div></nav></div></section></body></html>
