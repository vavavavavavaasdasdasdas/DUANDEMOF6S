<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/admin-layout :: layout(~{::section})}"><body><section class="catalog-page">
<div class="admin-heading"><div><span class="eyebrow">THIẾT LẬP HÀNG HÓA</span><h1 th:text="(${lookup.id==null} ? 'Thêm ' : 'Sửa ')+${lookupTitle.toLowerCase()}"></h1></div></div>
<form class="admin-panel catalog-form catalog-form-narrow" method="post" th:action="@{/admin/{kind}/save(kind=${kind})}" th:object="${lookup}" novalidate data-admin-form><input type="hidden" th:field="*{id}"><p class="form-message" role="alert" hidden></p>
<div class="catalog-field"><label for="value" th:text="${lookupTitle}+' *'"></label><input class="form-control" type="text" id="value" th:field="*{value}" required th:maxlength="${kind=='sizes' ? 10 : 100}" aria-describedby="value-error"><p class="field-error" id="value-error" aria-live="polite"><span th:if="${#fields.hasErrors('value')}" th:errors="*{value}"></span></p></div>
<div class="catalog-field" th:if="${kind=='categories'}"><label for="status">Trạng thái</label><select class="form-select" id="status" th:field="*{status}"><option value="true">Đang hoạt động</option><option value="false">Ngừng hoạt động</option></select></div>
<div class="catalog-form-actions"><button type="submit" class="btn btn-primary" th:text="'Lưu '+${lookupTitle.toLowerCase()}"></button><a class="btn btn-outline-secondary" th:href="@{/admin/{kind}(kind=${kind})}">Quay lại danh sách</a></div></form></section></body></html>
