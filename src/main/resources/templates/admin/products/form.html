<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>ThAm/S-a Sn Phcm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Sn Phcm</h2>
    <form th:action="@{/admin/products-crud/save}" th:object="${product}" method="post">
        <input type="hidden" th:field="*{id}" />
        <div class="mb-3">
            <label>MA Sn Phcm</label>
            <input type="text" class="form-control" th:field="*{code}" />
            <div class="text-danger" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
        </div>
        <div class="mb-3">
            <label>TAn Sn Phcm</label>
            <input type="text" class="form-control" th:field="*{name}" />
            <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>
        <div class="mb-3">
            <label>Danh mc</label>
            <select class="form-control" th:field="*{categoryId}">
                <option value="">-- Ch-n danh mc --</option>
                <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>
        </div>
        <div class="mb-3">
            <label>URL HAnh nh</label>
            <input type="text" class="form-control" th:field="*{imageUrl}" />
        </div>
        <div class="mb-3">
            <label>MA' t</label>
            <textarea class="form-control" th:field="*{description}"></textarea>
        </div>
        <button type="submit" class="btn btn-success">Lu</button>
        <a href="/admin/products-crud" class="btn btn-secondary">H y</a>
    </form>
</div>
</body>
</html>
