<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý Sản Phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Danh sách Sản Phẩm</h2>
    <a href="/admin/products-crud/create" class="btn btn-primary mb-3">Thêm mới</a>
    <a href="/admin" class="btn btn-secondary mb-3">Quay lại Dashboard</a>
    <table class="table table-bordered">
        <thead>
        <tr>
            <th>Mã SP</th>
            <th>Tên SP</th>
            <th>Danh mục</th>
            <th>Hình ảnh</th>
            <th>Hành động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${products}">
            <td th:text="${p.code}"></td>
            <td th:text="${p.name}"></td>
            <td th:text="${p.category != null ? p.category.name : ''}"></td>
            <td><img th:if="${p.imageUrl != null}" th:src="${p.imageUrl}" width="50" height="50"/></td>
            <td>
                <a th:href="@{/admin/products-crud/edit/{id}(id=${p.id})}" class="btn btn-sm btn-warning">Sửa</a>
                <a th:href="@{/admin/products-crud/delete/{id}(id=${p.id})}" class="btn btn-sm btn-danger">Xóa</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
