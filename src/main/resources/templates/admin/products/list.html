<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/admin-layout :: layout(~{::section})}"><body><section class="catalog-page">
<div class="admin-heading"><div><span class="eyebrow">DANH MỤC HÀNG HÓA</span><h1>Sản phẩm</h1><p class="admin-description">Quản lý thông tin, giá và tồn kho theo từng size.</p></div><a class="btn btn-primary" th:href="@{/admin/products-crud/create}">Thêm sản phẩm</a></div>
<div class="admin-panel">
<form class="catalog-filters" method="get" th:action="@{/admin/products-crud}" novalidate>
<div><label for="keyword">Tìm sản phẩm</label><div class="search-control"><input class="form-control" type="search" id="keyword" name="keyword" th:value="${keyword}" placeholder="Tên hoặc mã sản phẩm" maxlength="255"><button type="button" class="search-clear" aria-label="Xóa tìm kiếm" data-clear-search>×</button></div></div>
<div><label for="categoryId">Danh mục</label><select id="categoryId" name="categoryId" class="form-select"><option value="">Tất cả danh mục</option><option th:each="c:${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${categoryId==c.id}"></option></select></div>
<div><label for="filter-status">Trạng thái</label><select id="filter-status" name="status" class="form-select"><option value="">Tất cả trạng thái</option><option value="true" th:selected="${status==true}">Đang bán</option><option value="false" th:selected="${status==false}">Ngừng bán</option></select></div>
<div><label for="sort">Sắp xếp</label><select id="sort" name="sort" class="form-select"><option value="newest" th:selected="${sort=='newest'}">Mới nhất</option><option value="name" th:selected="${sort=='name'}">Tên A–Z</option><option value="code" th:selected="${sort=='code'}">Mã A–Z</option><option value="price_asc" th:selected="${sort=='price_asc'}">Giá tăng dần</option><option value="price_desc" th:selected="${sort=='price_desc'}">Giá giảm dần</option><option value="stock" th:selected="${sort=='stock'}">Tồn kho tăng dần</option></select></div>
<div><label for="size">Mỗi trang</label><select id="size" name="size" class="form-select"><option th:each="n:${ {10,20,50} }" th:value="${n}" th:text="${n}" th:selected="${productPage.size==n}"></option></select></div>
<button class="btn btn-outline-primary" type="submit">Lọc</button></form>
<div class="table-wrap"><table class="admin-table catalog-table"><thead><tr><th>Ảnh</th><th>Mã / Tên sản phẩm</th><th>Danh mục</th><th>Giá (₫)</th><th>Tồn kho</th><th>Trạng thái</th><th>Hành động</th></tr></thead><tbody>
<tr th:each="p:${productPage.content}">
<td><img class="catalog-thumb" th:src="${p.image_url != null && (p.image_url.startsWith('/uploads/') || p.image_url.startsWith('/images/')) ? p.image_url : '/images/product-placeholder.svg'}" th:alt="${p.name}" width="56" height="56"></td>
<td><span class="catalog-code" th:text="${p.code}"></span><a class="catalog-name" th:href="@{/admin/products-crud/view/{id}(id=${p.id})}" th:text="${p.name}"></a></td>
<td th:text="${p.category_name}"></td><td><span th:if="${p.price!=null}" th:text="${@money.format(p.price)}"></span><span th:if="${p.price!=null and p.price!=p.max_price}" th:text="' – '+${@money.format(p.max_price)}"></span><span class="text-muted" th:if="${p.price==null}">Chưa có variant</span></td>
<td th:text="${p.stock}"></td><td><span class="status-pill" th:text="${p.status == true ? 'Đang bán' : 'Ngừng bán'}"></span></td>
<td><div class="catalog-actions"><a th:href="@{/admin/products-crud/view/{id}(id=${p.id})}">Xem</a><a th:href="@{/admin/products-crud/edit/{id}(id=${p.id})}">Sửa</a><a th:href="@{/admin/products-crud/{id}/variants(id=${p.id})}">Quản lý variant</a><form th:action="@{/admin/products-crud/delete/{id}(id=${p.id})}" method="post" novalidate data-delete-form><button class="btn-link-danger" type="button" data-delete th:attr="data-object=${p.name}" data-consequence="Sản phẩm có đơn hàng hoặc variant sẽ chuyển sang ngừng bán; sản phẩm chưa được tham chiếu sẽ bị xóa.">Xóa</button></form></div></td></tr>
<tr th:if="${productPage.empty}"><td colspan="7" class="catalog-empty">Không tìm thấy sản phẩm. Thử bỏ bớt bộ lọc hoặc thêm sản phẩm mới.</td></tr>
</tbody></table></div>
<nav class="catalog-pagination" aria-label="Phân trang sản phẩm"><span th:text="${productPage.totalElements}+' sản phẩm · Trang '+${productPage.number+1}+'/'+${T(java.lang.Math).max(1,productPage.totalPages)}"></span><div>
<a class="btn btn-outline-secondary btn-sm" th:if="${productPage.hasPrevious()}" th:href="@{/admin/products-crud(keyword=${keyword},categoryId=${categoryId},status=${status},sort=${sort},size=${productPage.size},page=${productPage.number-1})}">Trang trước</a>
<a class="btn btn-outline-secondary btn-sm" th:if="${productPage.hasNext()}" th:href="@{/admin/products-crud(keyword=${keyword},categoryId=${categoryId},status=${status},sort=${sort},size=${productPage.size},page=${productPage.number+1})}">Trang sau</a></div></nav>
</div></section></body></html>
