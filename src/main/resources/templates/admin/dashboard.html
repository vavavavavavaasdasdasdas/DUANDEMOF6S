<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/admin">ShoeAdmin</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link active" href="/admin/dashboard">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/pos">Bán Hàng (POS)</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/orders">Đơn Hàng</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/products-crud">Sản Phẩm</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/customers">Khách Hàng</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/employees">Nhân Viên</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/vouchers">Voucher</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/promotions">Khuyến Mãi</a></li>
            </ul>
            <span class="navbar-text">
                <a href="/logout" class="btn btn-outline-light btn-sm">Đăng Xuất</a>
            </span>
        </div>
    </div>
</nav>
<div class="container mt-4">
    <h1>Dashboard</h1>
    <p>Chào mừng bạn đến với trang quản trị.</p>
    <div class="row mt-4">
        <div class="col-md-3">
            <div class="card text-white bg-primary mb-3">
                <div class="card-body">
                    <h5 class="card-title">Sản Phẩm</h5>
                    <a href="/admin/products-crud" class="text-white">Quản lý &rarr;</a>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-white bg-success mb-3">
                <div class="card-body">
                    <h5 class="card-title">Đơn Hàng</h5>
                    <a href="/admin/orders" class="text-white">Quản lý &rarr;</a>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-white bg-warning mb-3">
                <div class="card-body">
                    <h5 class="card-title">Khách Hàng</h5>
                    <a href="/admin/customers" class="text-white">Quản lý &rarr;</a>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-white bg-info mb-3">
                <div class="card-body">
                    <h5 class="card-title">Bán hàng (POS)</h5>
                    <a href="/admin/pos" class="text-white">Truy cập &rarr;</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
