<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/bo-cuc/bo-cuc-quan-tri :: layout(~{::section})}"><body><section class="catalog-page">
<div class="admin-heading"><div><span class="eyebrow">SIZE · GIÁ · TỒN KHO</span><h1 th:text="${selectedProduct!=null ? 'Variant: '+selectedProduct.name : 'Variant sản phẩm'}"></h1><p class="admin-description">Mỗi bộ ba sản phẩm, size và chất liệu là một biến thể duy nhất.</p></div><a class="btn btn-primary" th:href="@{/admin/variants/create(productId=${productId})}">Thêm variant</a></div>
<div class="admin-panel"><form class="catalog-filters" method="get" th:action="@{/admin/variants}" novalidate><div><label for="productId">Sản phẩm</label><select class="form-select" id="productId" name="productId"><option value="">Tất cả sản phẩm</option><option th:each="p:${products}" th:value="${p.id}" th:text="${p.code}+' · '+${p.name}" th:selected="${productId==p.id}"></option></select></div><div><label for="materialId">Chất liệu</label><select class="form-select" id="materialId" name="materialId"><option value="">Tất cả chất liệu</option><option th:each="m:${materials}" th:value="${m.id}" th:selected="${materialId==m.id}" th:text="${m.name}"></option></select></div><button class="btn btn-outline-primary" type="submit">Lọc</button></form>
<div class="table-wrap"><table class="admin-table catalog-table"><thead><tr><th>Sản phẩm</th><th>Size</th><th>Chất liệu</th><th>Giá (₫)</th><th>Tồn kho</th><th>Trạng thái</th><th>Hành động</th></tr></thead><tbody><tr th:each="v:${variants}"><td><span class="catalog-code" th:text="${v.code}"></span><span class="catalog-name" th:text="${v.name}"></span></td><td th:text="${v.size_value}"></td><td th:text="${v.material_name}"></td><td th:text="${@money.format(v.price)}"></td><td th:text="${v.quantity}"></td><td th:text="${v.status == true ? 'Đang bán' : 'Ngừng bán'}"></td><td><div class="catalog-actions"><a th:href="@{/admin/variants/edit/{id}(id=${v.id})}">Sửa variant</a><a th:href="@{/admin/inventory/adjust/{id}(id=${v.id})}">Điều chỉnh tồn</a></div></td></tr><tr th:if="${#lists.isEmpty(variants)}"><td colspan="7" class="catalog-empty">Chưa có variant. Chọn “Thêm variant” để tạo size, giá và tồn kho.</td></tr></tbody></table></div>
<a class="btn btn-outline-secondary mt-3" th:href="@{/admin/products-crud}">Quay lại sản phẩm</a></div><nav th:replace="~{fragments/phan-trang :: phan-trang(${dataPage},'page')}"></nav></section></body></html>
