<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>ThAm/S-a NhAn ViAn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>NhAn ViAn</h2>
    <form th:action="@{/admin/employees/save}" th:object="${employee}" method="post">
        <input type="hidden" th:field="*{id}" />
        <div class="mb-3">
            <label>MA NhAn ViAn</label>
            <input type="text" class="form-control" th:field="*{employeeCode}" />
            <div class="text-danger" th:if="${#fields.hasErrors('employeeCode')}" th:errors="*{employeeCode}"></div>
        </div>
        <div class="mb-3">
            <label>TAn NhAn ViAn</label>
            <input type="text" class="form-control" th:field="*{fullName}" />
            <div class="text-danger" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
        </div>
        <div class="mb-3">
            <label>S Din thoi</label>
            <input type="text" class="form-control" th:field="*{phone}" />
            <div class="text-danger" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
        </div>
        <div class="mb-3">
            <label>Chcc v</label>
            <input type="text" class="form-control" th:field="*{position}" />
        </div>
        <button type="submit" class="btn btn-success">Lu</button>
        <a href="/admin/employees" class="btn btn-secondary">H y</a>
    </form>
</div>
</body>
</html>
