<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/admin-layout :: layout(~{::section})}"><body><section class="catalog-page">
<div class="admin-heading"><div><span class="eyebrow">QUẢN LÝ HỒ SƠ</span><h1>Nhân viên</h1><p class="admin-description">Quản lý hồ sơ và tài khoản nhân viên trong cùng một giao dịch.</p></div><a class="btn btn-primary" href="/admin/employees/create">Thêm nhân viên</a></div>
<div class="admin-panel">
<form class="catalog-filters" method="get" novalidate action="/admin/employees"><div><label for="keyword">Tìm nhân viên</label><div class="search-control"><input id="keyword" class="form-control" type="search" name="keyword" th:value="${keyword}" placeholder="Tên, số điện thoại hoặc email" maxlength="100"><button type="button" class="search-clear" aria-label="Xóa tìm kiếm" data-clear-search>×</button></div></div><button class="btn btn-outline-primary" type="submit">Tìm kiếm</button></form>
<div class="table-wrap"><table class="admin-table"><thead><tr><th>Mã / Họ tên</th><th>Liên hệ</th><th>Tài khoản</th><th>Trạng thái</th><th>Hành động</th></tr></thead><tbody>
<tr th:each="p:${peoplePage.content}"><td><span class="catalog-code" th:text="${p.employeeCode}"></span><a class="catalog-name" th:href="@{/admin/employees/detail/{id}(id=${p.id})}" th:text="${p.fullName}"></a></td><td><span class="people-contact" th:text="${p.phone}"></span><span class="people-contact" th:text="${p.email}"></span></td><td th:text="${p.user!=null ? p.user.username : 'Chưa có tài khoản'}"></td><td><span class="status-pill" th:text="${p.status==true ? 'Hoạt động' : 'Vô hiệu hóa'}"></span></td><td><div class="catalog-actions"><a th:href="@{/admin/employees/detail/{id}(id=${p.id})}">Xem chi tiết</a><a th:href="@{/admin/employees/edit/{id}(id=${p.id})}">Sửa</a></div></td></tr>
<tr th:if="${peoplePage.empty}"><td colspan="5" class="catalog-empty">Không tìm thấy hồ sơ. Thử từ khóa khác hoặc thêm hồ sơ mới.</td></tr></tbody></table></div>
<nav class="catalog-pagination" aria-label="Phân trang"><span th:text="${peoplePage.totalElements}+' hồ sơ · Trang '+${peoplePage.number+1}+'/'+${T(java.lang.Math).max(1,peoplePage.totalPages)}"></span><div><a class="btn btn-outline-secondary btn-sm" th:if="${peoplePage.hasPrevious()}" th:href="@{/admin/employees(keyword=${keyword},page=${peoplePage.number-1})}">Trang trước</a><a class="btn btn-outline-secondary btn-sm" th:if="${peoplePage.hasNext()}" th:href="@{/admin/employees(keyword=${keyword},page=${peoplePage.number+1})}">Trang sau</a></div></nav></div>
</section></body></html>
