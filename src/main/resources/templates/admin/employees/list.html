<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý Nhân Viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Danh sách Nhân Viên</h2>
    <a href="/admin/employees/create" class="btn btn-primary mb-3">Thêm mới</a>
    <a href="/admin" class="btn btn-secondary mb-3">Quay lại Dashboard</a>
    <table class="table table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>Mã NV</th>
            <th>Tên</th>
            <th>SĐT</th>
            <th>Chức vụ</th>
            <th>Hành động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="e : ${employees}">
            <td th:text="${e.id}"></td>
            <td th:text="${e.employeeCode}"></td>
            <td th:text="${e.fullName}"></td>
            <td th:text="${e.phone}"></td>
            <td th:text="${e.position}"></td>
            <td>
                <a th:href="@{/admin/employees/edit/{id}(id=${e.id})}" class="btn btn-sm btn-warning">Sửa</a>
                <a th:href="@{/admin/employees/delete/{id}(id=${e.id})}" class="btn btn-sm btn-danger">Xóa</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
