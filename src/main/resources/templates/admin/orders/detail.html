<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Chi tiết Đơn Hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Chi tiết Đơn Hàng <span th:text="${order.orderCode}"></span></h2>
    <div class="row">
        <div class="col-md-6">
            <h4>Thông tin khách hàng</h4>
            <p><strong>Tên:</strong> <span th:text="${order.customer != null ? order.customer.fullName : 'Khách lẻ'}"></span></p>
            <p><strong>SĐT:</strong> <span th:text="${order.phoneNumber}"></span></p>
            <p><strong>Địa chỉ:</strong> <span th:text="${order.shippingAddress}"></span></p>
        </div>
        <div class="col-md-6">
            <h4>Thông tin đơn hàng</h4>
            <p><strong>Loại đơn:</strong> <span th:text="${order.orderType}"></span></p>
            <p><strong>Ngày tạo:</strong> <span th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}"></span></p>
            <p><strong>Tổng tiền:</strong> <span th:text="${order.finalAmount}"></span></p>
            <p><strong>Trạng thái hiện tại:</strong> <span class="badge bg-primary" th:text="${order.status}"></span></p>
            
            <form th:action="@{/admin/orders/update-status/{id}(id=${order.id})}" method="post">
                <div class="input-group">
                    <select name="status" class="form-control">
                        <option value="PENDING" th:selected="${order.status == 'PENDING'}">Chờ xác nhận</option>
                        <option value="CONFIRMED" th:selected="${order.status == 'CONFIRMED'}">Đã xác nhận</option>
                        <option value="PREPARING" th:selected="${order.status == 'PREPARING'}">Đang chuẩn bị</option>
                        <option value="SHIPPING" th:selected="${order.status == 'SHIPPING'}">Đang giao</option>
                        <option value="DELIVERED" th:selected="${order.status == 'DELIVERED'}">Đã giao</option>
                        <option value="CANCELLED" th:selected="${order.status == 'CANCELLED'}">Đã hủy</option>
                    </select>
                    <button type="submit" class="btn btn-success">Cập nhật</button>
                </div>
            </form>
        </div>
    </div>
    
    <h4 class="mt-4">Sản phẩm</h4>
    <table class="table table-bordered">
        <thead>
        <tr>
            <th>Sản phẩm</th>
            <th>Size</th>
            <th>Số lượng</th>
            <th>Đơn giá</th>
            <th>Thành tiền</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="detail : ${order.orderDetails}">
            <td th:text="${detail.productVariant.product.name}"></td>
            <td th:text="${detail.productVariant.size.sizeValue}"></td>
            <td th:text="${detail.quantity}"></td>
            <td th:text="${detail.price}"></td>
            <td th:text="${detail.totalPrice}"></td>
        </tr>
        </tbody>
    </table>
    
    <a href="/admin/orders" class="btn btn-secondary">Quay lại danh sách</a>
</div>
</body>
</html>
