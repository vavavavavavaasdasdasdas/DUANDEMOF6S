<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bán Hàng Tại Quầy (POS) | ShoeAdmin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container-fluid">
        <a class="navbar-brand" href="/admin">ShoeAdmin</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/admin/dashboard">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link active" href="/admin/pos">POS</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container-fluid mt-4">
    <div class="row">
        <!-- Products Section -->
        <div class="col-md-7">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Danh sách Sản Phẩm</h5>
                </div>
                <div class="card-body" style="height: 75vh; overflow-y: auto;">
                    <div th:if="${param.error != null}" class="alert alert-danger" th:text="${param.error}"></div>
                    <div th:if="${param.success != null}" class="alert alert-success">Đặt hàng thành công!</div>
                    
                    <div class="row row-cols-1 row-cols-md-3 g-3">
                        <div class="col" th:each="v : ${variants}">
                            <div class="card h-100 shadow-sm border-0">
                                <div class="card-body">
                                    <h6 class="card-title fw-bold" th:text="${v.product.name}"></h6>
                                    <p class="small text-muted mb-1" th:text="'Size: ' + ${v.size.sizeValue}"></p>
                                    <p class="text-danger fw-bold" th:text="${#numbers.formatDecimal(v.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></p>
                                    <form action="/admin/pos/add" method="post" class="d-flex align-items-center">
                                        <input type="hidden" name="variantId" th:value="${v.id}" />
                                        <input type="number" name="quantity" class="form-control form-control-sm me-2" value="1" min="1" style="width: 60px;" th:disabled="${v.quantity <= 0}">
                                        <button type="submit" class="btn btn-sm btn-outline-primary" th:disabled="${v.quantity <= 0}">Thêm</button>
                                    </form>
                                    <div th:if="${v.quantity <= 0}" class="text-danger small mt-1">Hết hàng</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Cart Section -->
        <div class="col-md-5">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0">Giỏ Hàng (POS)</h5>
                </div>
                <div class="card-body" style="height: 75vh; display: flex; flex-direction: column;">
                    <div style="flex-grow: 1; overflow-y: auto;">
                        <table class="table table-sm">
                            <thead>
                                <tr>
                                    <th>SP</th>
                                    <th>Size</th>
                                    <th>SL</th>
                                    <th>Tổng</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${posCart}">
                                    <td th:text="${item.productName}"></td>
                                    <td th:text="${item.size}"></td>
                                    <td th:text="${item.quantity}"></td>
                                    <td th:text="${#numbers.formatDecimal(item.totalPrice, 0, 'COMMA', 0, 'POINT')}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="mt-3 border-top pt-3">
                        <h4 class="text-end text-danger fw-bold">Tổng: <span th:text="${#numbers.formatDecimal(total, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span></h4>
                        <form action="/admin/pos/checkout" th:object="${posCheckoutRequest}" method="post">
                            <div class="mb-2">
                                <label class="form-label">Phương thức thanh toán</label>
                                <select th:field="*{paymentMethod}" class="form-select">
                                    <option value="CASH">Tiền mặt</option>
                                    <option value="TRANSFER">Chuyển khoản</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-success btn-lg w-100 mt-2" th:disabled="${posCart.empty}">THANH TOÁN</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
