<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>ThAm/S-a KhAch HAng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>KhAch HAng</h2>
    <form th:action="@{/admin/customers/save}" th:object="${customer}" method="post">
        <input type="hidden" th:field="*{id}" />
        <div class="mb-3">
            <label>MA KhAch HAng</label>
            <input type="text" class="form-control" th:field="*{customerCode}" />
            <div class="text-danger" th:if="${#fields.hasErrors('customerCode')}" th:errors="*{customerCode}"></div>
        </div>
        <div class="mb-3">
            <label>TAn KhAch HAng</label>
            <input type="text" class="form-control" th:field="*{fullName}" />
            <div class="text-danger" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
        </div>
        <div class="mb-3">
            <label>S Din thoi</label>
            <input type="text" class="form-control" th:field="*{phone}" />
            <div class="text-danger" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
        </div>
        <div class="mb-3">
            <label>Email</label>
            <input type="email" class="form-control" th:field="*{email}" />
            <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>
        <div class="mb-3">
            <label>Da ch</label>
            <input type="text" class="form-control" th:field="*{address}" />
        </div>
        <button type="submit" class="btn btn-success">Lu</button>
        <a href="/admin/customers" class="btn btn-secondary">H y</a>
    </form>
</div>
</body>
</html>
