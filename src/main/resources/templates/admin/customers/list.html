<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý Khách Hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Danh sách Khách Hàng</h2>
    <a href="/admin/customers/create" class="btn btn-primary mb-3">Thêm mới</a>
    <a href="/admin" class="btn btn-secondary mb-3">Quay lại Dashboard</a>
    <table class="table table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>Mã KH</th>
            <th>Tên</th>
            <th>SĐT</th>
            <th>Hành động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${customers}">
            <td th:text="${c.id}"></td>
            <td th:text="${c.customerCode}"></td>
            <td th:text="${c.fullName}"></td>
            <td th:text="${c.phone}"></td>
            <td>
                <a th:href="@{/admin/customers/edit/{id}(id=${c.id})}" class="btn btn-sm btn-warning">Sửa</a>
                <a th:href="@{/admin/customers/delete/{id}(id=${c.id})}" class="btn btn-sm btn-danger">Xóa</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
