<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý Đợt Giảm Giá</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Danh sách Đợt Giảm Giá (Promotions)</h2>
    <a href="/admin/promotions/create" class="btn btn-primary mb-3">Thêm mới</a>
    <a href="/admin" class="btn btn-secondary mb-3">Quay lại Dashboard</a>
    <table class="table table-bordered">
        <thead>
        <tr>
            <th>Tên</th>
            <th>Loại</th>
            <th>Giá trị giảm</th>
            <th>Ngày kết thúc</th>
            <th>Hành động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${promotions}">
            <td th:text="${p.name}"></td>
            <td th:text="${p.discountType}"></td>
            <td th:text="${p.discountValue}"></td>
            <td th:text="${#temporals.format(p.endDate, 'dd/MM/yyyy HH:mm')}"></td>
            <td>
                <a th:href="@{/admin/promotions/edit/{id}(id=${p.id})}" class="btn btn-sm btn-warning">Sửa</a>
                <a th:href="@{/admin/promotions/delete/{id}(id=${p.id})}" class="btn btn-sm btn-danger">Xóa</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
