<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/bo-cuc/bo-cuc-quan-tri :: layout(~{::section})}"><body><section class="catalog-page">
<div class="admin-heading"><div><span class="eyebrow">THÔNG TIN SẢN PHẨM</span><h1 th:text="${product.id==null ? 'Thêm sản phẩm' : 'Sửa sản phẩm'}"></h1><p class="admin-description">Lưu thông tin trước, sau đó thêm variant cho từng size.</p></div></div>
<form class="admin-panel catalog-form" th:action="@{/admin/products-crud/save}" method="post" enctype="multipart/form-data" th:object="${product}" novalidate data-admin-form>
<input type="hidden" th:field="*{id}"><p class="form-message" role="alert" hidden></p>
<div class="catalog-form-grid"><div>
<div class="catalog-field"><label for="name">Tên sản phẩm *</label><input class="form-control" id="name" type="text" th:field="*{name}" required maxlength="255" aria-describedby="name-error" th:attr="aria-invalid=${#fields.hasErrors('name')}"><p class="field-error" id="name-error" aria-live="polite"><span th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span></p></div>
<div class="catalog-field"><label for="code">Mã sản phẩm *</label><input class="form-control" id="code" type="text" th:field="*{code}" required maxlength="50" pattern="[A-Za-z0-9_\-]{1,50}" data-format-message="Mã gồm chữ, số, dấu - hoặc _." aria-describedby="code-error" th:attr="aria-invalid=${#fields.hasErrors('code')}"><p class="field-error" id="code-error" aria-live="polite"><span th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></span></p></div>
<div class="catalog-field"><label for="categoryId">Danh mục *</label><select id="categoryId" class="form-select" th:field="*{categoryId}" required aria-describedby="categoryId-error"><option value="">Chọn danh mục</option><option th:each="c:${categories}" th:value="${c.id}" th:text="${c.name}"></option></select><p class="field-error" id="categoryId-error" aria-live="polite"><span th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></span></p></div>
<div class="catalog-field"><label for="status">Trạng thái</label><select id="status" class="form-select" th:field="*{status}" required aria-describedby="status-error"><option value="true">Đang hoạt động</option><option value="false">Ngừng hoạt động</option></select><p class="field-error" id="status-error" aria-live="polite"><span th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></span></p></div>
<div class="catalog-field"><label for="description">Mô tả</label><textarea id="description" class="resize-none form-control" th:field="*{description}" rows="6" maxlength="4000" aria-describedby="description-error"></textarea><p class="field-error" id="description-error" aria-live="polite"><span th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span></p></div>
</div><aside class="catalog-image-panel"><h2>Ảnh sản phẩm</h2><img id="image-preview" class="catalog-preview" th:src="${product.imageUrl!=null && (product.imageUrl.startsWith('/uploads/') || product.imageUrl.startsWith('/images/')) ? product.imageUrl : '/anh/anh-san-pham-thay-the.svg'}" alt="Ảnh xem trước" width="360" height="360">
<div class="catalog-field"><label for="image">Chọn ảnh PNG hoặc JPEG</label><input id="image" type="file" class="form-control" th:field="*{image}" accept="image/png,image/jpeg" th:attr="data-max-bytes=${uploadMaxBytes}" aria-describedby="image-error image-help"><p class="field-error" id="image-error" aria-live="polite"><span th:if="${#fields.hasErrors('image')}" th:errors="*{image}"></span></p><p id="image-help" class="field-help" th:text="'Tối đa '+${uploadMaxBytes/1024/1024}+' MB, 16 triệu điểm ảnh. Không chọn ảnh mới để giữ ảnh hiện tại.'"></p></div><button class="btn btn-outline-secondary btn-sm" type="button" data-clear-upload>Bỏ ảnh vừa chọn</button></aside></div>
<div class="catalog-form-actions"><button type="submit" class="btn btn-primary">Lưu sản phẩm</button><a class="btn btn-outline-secondary" th:href="@{/admin/products-crud}">Quay lại danh sách</a></div>
</form></section></body></html>
