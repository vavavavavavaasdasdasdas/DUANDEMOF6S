<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/bo-cuc/bo-cuc-quan-tri :: layout(~{::section})}"><body><section class="catalog-page">
<div class="admin-heading"><div><span class="eyebrow" th:text="${product.code}"></span><h1 th:text="${product.name}"></h1><p class="admin-description" th:text="${product.status == true ? 'Đang bán' : 'Ngừng bán'}"></p></div><div class="catalog-actions"><a class="btn btn-outline-secondary" th:href="@{/admin/products-crud/edit/{id}(id=${product.id})}">Sửa sản phẩm</a><a class="btn btn-primary" th:href="@{/admin/products-crud/{id}/variants(id=${product.id})}">Quản lý variant</a></div></div>
<div class="admin-panel catalog-detail"><img class="catalog-preview" th:src="${product.imageUrl!=null && (product.imageUrl.startsWith('/uploads/') || product.imageUrl.startsWith('/images/')) ? product.imageUrl : '/anh/anh-san-pham-thay-the.svg'}" th:alt="${product.name}" width="300" height="300"><div><h2>Thông tin sản phẩm</h2><p>Danh mục: <strong th:text="${product.category!=null ? product.category.name : 'Chưa phân loại'}"></strong></p><p class="catalog-description" th:text="${product.description}"></p><a th:if="${product.status}" class="btn btn-outline-primary" th:href="@{/products/{id}(id=${product.id})}">Xem trên cửa hàng</a><a class="btn btn-outline-secondary" th:href="@{/admin/products-crud}">Quay lại danh sách</a></div></div>
<article class="admin-panel mt-4"><h2>Size, giá và tồn kho</h2><div class="table-wrap"><table class="admin-table"><thead><tr><th>Size</th><th>Giá (₫)</th><th>Tồn kho</th><th>Trạng thái</th></tr></thead><tbody><tr th:each="v:${variants}"><td th:text="${v.size_value}"></td><td th:text="${@money.format(v.price)}"></td><td th:text="${v.quantity}"></td><td th:text="${v.status == true ? 'Đang bán' : 'Ngừng bán'}"></td></tr><tr th:if="${#lists.isEmpty(variants)}"><td colspan="4" class="catalog-empty">Chưa có variant. Thêm size, giá và số lượng để sản phẩm xuất hiện ở cửa hàng.</td></tr></tbody></table></div></article></section></body></html>
