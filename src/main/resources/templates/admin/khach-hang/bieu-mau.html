<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/bo-cuc/bo-cuc-quan-tri :: layout(~{::section})}"><body><section class="catalog-page">
<div class="admin-heading"><div><span class="eyebrow">QUẢN LÝ HỒ SƠ</span><h1 th:text="${customer.id==null ? 'Thêm khách hàng' : 'Sửa khách hàng'}"></h1><p class="admin-description">Trạng thái được quản lý riêng tại trang chi tiết và luôn cần xác nhận.</p></div></div>
<form class="admin-panel catalog-form catalog-form-narrow" method="post" th:action="@{/admin/customers/save}" th:object="${customer}" novalidate data-admin-form>
<input type="hidden" th:field="*{id}"><p class="form-message" role="alert" hidden></p><p class="field-error" role="alert" th:if="${#fields.hasGlobalErrors()}" th:each="e:${#fields.globalErrors()}" th:text="${e}"></p>
<div class="catalog-field"><label for="customerCode">Mã khách hàng *</label><input class="form-control" id="customerCode" type="text" th:field="*{customerCode}" required maxlength="20" pattern="[A-Za-z0-9_\-]{1,20}" aria-describedby="customerCode-error"><p class="field-error" id="customerCode-error" aria-live="polite"><span th:if="${#fields.hasErrors('customerCode')}" th:errors="*{customerCode}"></span></p></div>
<div class="catalog-field"><label for="fullName">Họ tên *</label><input class="form-control" id="fullName" type="text" th:field="*{fullName}" required maxlength="100" autocomplete="name" aria-describedby="fullName-error"><p class="field-error" id="fullName-error" aria-live="polite"><span th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span></p></div>
<div class="catalog-field"><label for="phone">Số điện thoại *</label><input class="form-control" id="phone" type="tel" th:field="*{phone}" required maxlength="20" pattern="(?:0[0-9]{9}|\+84[0-9]{9})" data-format-message="SĐT gồm 10 số bắt đầu bằng 0 hoặc +84 và 9 số." autocomplete="tel" aria-describedby="phone-error"><p class="field-error" id="phone-error" aria-live="polite"><span th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span></p></div>
<div class="catalog-field"><label for="email">Thư điện tử *</label><input class="form-control" id="email" type="email" th:field="*{email}" required maxlength="100" autocomplete="email" aria-describedby="email-error"><p class="field-error" id="email-error" aria-live="polite"><span th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span></p></div>
<div class="catalog-field"><label for="address">Địa chỉ</label><input class="form-control" id="address" type="text" th:field="*{address}" maxlength="255" autocomplete="street-address" aria-describedby="address-error"><p class="field-error" id="address-error" aria-live="polite"><span th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></span></p></div>
<div class="catalog-form-actions"><button class="btn btn-primary" type="submit">Lưu khách hàng</button><a class="btn btn-outline-secondary" href="/admin/customers">Quay lại danh sách</a></div></form>
</section></body></html>
