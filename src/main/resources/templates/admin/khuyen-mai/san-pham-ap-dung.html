<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/bo-cuc/bo-cuc-quan-tri :: layout(~{::section})}"><body><section class="catalog-page"><div class="admin-heading"><div><span class="eyebrow">SẢN PHẨM ÁP DỤNG</span><h1 th:text="${promotion.name}"></h1><p class="admin-description">Chọn nhiều sản phẩm. Tìm kiếm chỉ ẩn dòng, giữ nguyên các sản phẩm đã chọn.</p></div><a class="btn btn-outline-secondary" href="/admin/promotions">Quay lại danh sách</a></div>
<form class="admin-panel" method="post" th:action="@{/admin/promotions/{id}/products(id=${promotion.id})}" data-admin-form novalidate><p class="form-message" hidden role="alert"></p>
<div class="catalog-filters"><div><label for="product-search">Tìm sản phẩm theo tên hoặc mã</label><div class="search-control"><input class="form-control" id="product-search" type="search" data-product-search><button type="button" class="search-clear" aria-label="Xóa tìm kiếm sản phẩm" data-clear-product-search>×</button></div></div></div>
<p data-selection-count role="status"></p><div class="table-wrap"><table class="admin-table"><thead><tr><th>Áp dụng</th><th>Mã</th><th>Sản phẩm</th><th>Trạng thái</th></tr></thead><tbody>
<tr th:each="p:${products}" data-product-row th:data-search="${p.name}+' '+${p.code}"><td><input class="form-check-input" type="checkbox" name="productIds" th:value="${p.id}" th:id="'product-'+${p.id}" th:checked="${selected.contains(p.id)}"></td><td th:text="${p.code}"></td><td><label th:for="'product-'+${p.id}" th:text="${p.name}"></label></td><td th:text="${p.status==true ? 'Đang bán' : 'Ngừng bán'}"></td></tr>
<tr data-products-empty hidden><td colspan="4" class="catalog-empty">Không tìm thấy sản phẩm. Thử từ khóa khác.</td></tr></tbody></table></div><div class="catalog-form-actions"><button type="submit" class="btn btn-primary">Lưu sản phẩm áp dụng</button><a th:href="@{/admin/promotions/edit/{id}(id=${promotion.id})}" class="btn btn-outline-secondary">Sửa chương trình</a></div></form><script src="/js/quan-tri-giam-gia.js" defer></script></section></body></html>
