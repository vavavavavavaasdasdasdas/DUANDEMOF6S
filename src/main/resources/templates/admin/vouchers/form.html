<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>ThAm/S-a MA Gim GiA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>MA Gim GiA</h2>
    <form th:action="@{/admin/vouchers/save}" th:object="${voucher}" method="post">
        <input type="hidden" th:field="*{id}" />
        <div class="mb-3">
            <label>MA Voucher</label>
            <input type="text" class="form-control" th:field="*{code}" />
            <div class="text-danger" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
        </div>
        <div class="mb-3">
            <label>TAn Chng TrAnh</label>
            <input type="text" class="form-control" th:field="*{name}" />
            <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>
        <div class="mb-3">
            <label>Loi Gim (PERCENT / FIXED)</label>
            <select class="form-control" th:field="*{discountType}">
                <option value="PERCENT">Ph n trm (%)</option>
                <option value="FIXED">S ti?n c` `</option>
            </select>
        </div>
        <div class="mb-3">
            <label>GiA tr gim</label>
            <input type="number" step="0.01" class="form-control" th:field="*{discountValue}" />
            <div class="text-danger" th:if="${#fields.hasErrors('discountValue')}" th:errors="*{discountValue}"></div>
        </div>
        <div class="mb-3">
            <label>Dn ti thiu</label>
            <input type="number" step="0.01" class="form-control" th:field="*{minOrderValue}" />
        </div>
        <div class="mb-3">
            <label>NgAy bt du</label>
            <input type="datetime-local" class="form-control" th:field="*{startDate}" />
            <div class="text-danger" th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"></div>
        </div>
        <div class="mb-3">
            <label>NgAy kt thAc</label>
            <input type="datetime-local" class="form-control" th:field="*{endDate}" />
            <div class="text-danger" th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}"></div>
        </div>
        <div class="mb-3">
            <label>KhAch HAng</label>
            <select class="form-control" th:field="*{customerId}">
                <option value="">-- Chn khAch hAng --</option>
                <option th:each="c : ${customers}" th:value="${c.id}" th:text="${c.fullName}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('customerId')}" th:errors="*{customerId}"></div>
        </div>
        <button type="submit" class="btn btn-success">Lu</button>
        <a href="/admin/vouchers" class="btn btn-secondary">H y</a>
    </form>
</div>
</body>
</html>
