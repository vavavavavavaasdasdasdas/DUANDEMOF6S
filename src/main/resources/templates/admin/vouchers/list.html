<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/admin-layout :: layout(~{::section})}"><body><section class="catalog-page"><div class="admin-heading"><div><span class="eyebrow">KHUYẾN MÃI</span><h1>Voucher</h1><p class="admin-description">Chỉ áp dụng khi hoạt động và trong thời gian hiệu lực.</p></div><a class="btn btn-primary" href="/admin/vouchers/create">Thêm voucher</a></div><div class="admin-panel"><div class="table-wrap"><table class="admin-table"><thead><tr><th>Mã / Tên</th><th>Mức giảm</th><th>Phạm vi</th><th>Thời gian</th><th>Lượt dùng</th><th>Trạng thái</th><th>Hành động</th></tr></thead><tbody><tr th:each="p:${vouchers}"><td><span class="catalog-code" th:text="${p.code}"></span><strong class="catalog-name" th:text="${p.name}"></strong></td><td th:text="${p.discountValue}+${p.discountType=='PERCENT' ? '%' : ' đ'}"></td><td><span th:text="${p.isPublic==true ? 'Công khai' : 'Riêng tư'}"></span><span class="people-contact" th:if="${p.isPublic!=true and p.customer!=null}" th:text="${p.customer.fullName}"></span></td><td><span class="people-contact" th:text="${#temporals.format(p.startDate,'dd/MM/yyyy HH:mm')}"></span><span class="people-contact" th:text="${#temporals.format(p.endDate,'dd/MM/yyyy HH:mm')}"></span></td><td th:text="${p.usedCount ?: 0}+' / '+${p.usageLimit ?: 'Không giới hạn'}"></td><td th:text="${p.status==true ? 'Hoạt động' : 'Đã khóa'}"></td><td><div class="catalog-actions"><a th:href="@{/admin/vouchers/edit/{id}(id=${p.id})}">Sửa</a><form method="post" novalidate th:action="@{/admin/vouchers/delete/{id}(id=${p.id})}"><button type="button" class="btn btn-outline-danger btn-sm" data-delete th:data-object="${p.name}" data-consequence="Voucher đã dùng sẽ được khóa để giữ đơn cũ.">Xóa</button></form></div></td></tr><tr th:if="${#lists.isEmpty(vouchers)}"><td colspan="7" class="catalog-empty">Chưa có dữ liệu. Thêm chương trình đầu tiên để bắt đầu.</td></tr></tbody></table></div></div></section></body></html>
