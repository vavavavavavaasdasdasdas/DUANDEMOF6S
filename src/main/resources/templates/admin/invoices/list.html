<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/admin-layout :: layout(~{::section})}"><body><section>
<div class="admin-heading"><div><span class="eyebrow">BÁN HÀNG</span><h1>Hóa đơn</h1><p class="admin-description">Hóa đơn của các đơn online và bán tại quầy.</p></div><a class="btn btn-primary" href="/admin/pos">Bán hàng tại quầy</a></div><div class="admin-panel"><form class="sales-filters" action="/admin/invoices" method="get" novalidate><div><label for="q">Mã hóa đơn</label><input class="form-control" id="q" name="q" th:value="${q}" type="search"></div><div><label for="from">Từ ngày</label><input class="form-control" id="from" type="date" name="from" th:value="${from}"></div><div><label for="to">Đến ngày</label><input class="form-control" id="to" type="date" name="to" th:value="${to}"></div><button class="btn btn-primary" type="submit">Lọc</button><a class="btn btn-outline-secondary" href="/admin/invoices">Xóa lọc</a></form><div class="table-wrap"><table class="admin-table"><thead><tr><th>Hóa đơn</th><th>Đơn hàng</th><th>Ngày</th><th>Khách</th><th>Nhân viên</th><th class="money">Tổng (đ)</th><th>Thanh toán</th></tr></thead><tbody><tr th:each="i:${invoices.content}"><td><a th:href="@{/admin/invoices/{id}(id=${i.id})}" th:text="${i.invoiceCode}"></a></td><td><a th:href="@{/admin/orders/{id}(id=${i.order.id})}" th:text="${i.order.orderCode}"></a></td><td th:text="${#temporals.format(i.issuedAt,'dd/MM/yyyy HH:mm')}"></td><td th:text="${i.customerName}"></td><td th:text="${i.employeeName}"></td><td class="money" th:text="${@money.format(i.order.finalAmount)}"></td><td th:text="${i.order.paymentStatus=='PAID'?'Đã thanh toán':'Chưa thanh toán'}"></td></tr><tr th:if="${invoices.empty}"><td colspan="7" class="sales-empty">Không có hóa đơn phù hợp.</td></tr></tbody></table></div><nav class="sales-pagination" aria-label="Phân trang hóa đơn"><a class="btn btn-outline-secondary" th:if="${invoices.hasPrevious()}" th:href="@{/admin/invoices(q=${q},from=${from},to=${to},page=${invoices.number-1})}">Trang trước</a><span th:text="'Trang '+${invoices.number+1}+' / '+${invoices.totalPages==0?1:invoices.totalPages}+' · '+${invoices.totalElements}+' hóa đơn'"></span><a class="btn btn-outline-secondary" th:if="${invoices.hasNext()}" th:href="@{/admin/invoices(q=${q},from=${from},to=${to},page=${invoices.number+1})}">Trang sau</a></nav></div>
</section></body></html>
