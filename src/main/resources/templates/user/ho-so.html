<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/bo-cuc/bo-cuc-nguoi-dung :: html}">
<head>
    <title>Hồ Sơ | SHOP GIÀY</title>
</head>
<body>
<div th:fragment="content" class="px-0">
    <div class="container my-5">
        <h3 class="fw-bold mb-4"><i class="bi bi-person-lines-fill text-primary"></i> Hồ Sơ Của Tôi</h3>

        <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
            <i class="bi bi-check-circle-fill"></i> <span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row g-4">
            <div class="col-lg-6">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-white py-3">
                        <h5 class="mb-0 fw-bold">Thông Tin Cá Nhân</h5>
                    </div>
                    <div class="card-body p-4">
                        <form action="/profile/update" method="post" data-user-form novalidate>
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Họ và tên</label>
                                <input type="text" class="form-control" name="fullName" th:value="${customer?.fullName}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Số điện thoại</label>
                                <input type="text" class="form-control" name="phone" th:value="${customer?.phone}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Email</label>
                                <input type="email" class="form-control" name="email" th:value="${customer?.email}" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-bold">Địa chỉ giao hàng</label>
                                <textarea class="form-control" name="address" rows="3" th:text="${customer?.address}"></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary px-4 rounded-pill">Lưu Thông Tin</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-white py-3">
                        <h5 class="mb-0 fw-bold">Đổi Mật Khẩu</h5>
                    </div>
                    <div class="card-body p-4">
                        <form action="/profile/change-password" method="post" data-user-form novalidate>
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Mật khẩu cũ</label>
                                <input type="password" autocomplete="current-password" class="form-control" name="oldPassword" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Mật khẩu mới</label>
                                <input type="password" autocomplete="current-password" class="form-control" name="newPassword" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-bold">Xác nhận mật khẩu mới</label>
                                <input type="password" autocomplete="current-password" class="form-control" name="confirmPassword" required>
                            </div>
                            <button type="submit" class="btn btn-danger px-4 rounded-pill">Đổi Mật Khẩu</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
