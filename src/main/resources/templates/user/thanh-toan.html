<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/bo-cuc/bo-cuc-nguoi-dung :: html}"><head><title>Thanh toán</title></head><body><div th:fragment="content" class="container my-5"><h2 class="fw-bold mb-4">Thanh toán</h2>
<form id="checkoutForm" th:object="${checkoutRequest}" th:action="@{/checkout/place}" method="post" novalidate><div class="row g-4"><div class="col-lg-7"><h4>Thông tin nhận hàng</h4><div class="row g-3"><div class="col-12"><label class="form-label" for="receiverName">Họ tên người nhận *</label><input class="form-control" id="receiverName" type="text" required th:field="*{receiverName}" aria-describedby="receiverName-error"><p class="text-danger small" id="receiverName-error" aria-live="polite"><span th:if="${#fields.hasErrors('receiverName')}" th:errors="*{receiverName}"></span></p></div><div class="col-12"><label class="form-label" for="phone">Số điện thoại *</label><input class="form-control" id="phone" type="tel" required th:field="*{phone}" aria-describedby="phone-error"><p class="text-danger small" id="phone-error" aria-live="polite"><span th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span></p></div><div class="col-12"><label class="form-label" for="email">Email *</label><input class="form-control" id="email" type="email" required th:field="*{email}" aria-describedby="email-error"><p class="text-danger small" id="email-error" aria-live="polite"><span th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span></p></div><div class="col-12"><label class="form-label" for="shippingAddress">Địa chỉ giao hàng *</label><input class="form-control" id="shippingAddress" type="text" required th:field="*{shippingAddress}" aria-describedby="shippingAddress-error"><p class="text-danger small" id="shippingAddress-error" aria-live="polite"><span th:if="${#fields.hasErrors('shippingAddress')}" th:errors="*{shippingAddress}"></span></p></div></div><h4 class="mt-4">Phương thức thanh toán</h4><label for="paymentMethod" class="form-label">Chọn phương thức *</label><select class="form-select" th:field="*{paymentMethod}" id="paymentMethod"><option value="COD">Thanh toán khi nhận hàng (COD)</option><option value="BANK_TRANSFER">Chuyển khoản ngân hàng</option></select><p class="text-danger"><span th:if="${#fields.hasErrors('paymentMethod')}" th:errors="*{paymentMethod}"></span></p><div id="bankInfo" class="mt-3 p-3 bg-light rounded" hidden><p>Ngân hàng: <span th:text="${bankName}"></span></p><p>Số tài khoản: <span th:text="${bankAccount}"></span></p><p>Chủ tài khoản: <span th:text="${bankOwner}"></span></p></div></div>
<div class="col-lg-5"><div class="bg-light p-4 rounded" data-voucher-preview="/checkout/validate-voucher-ajax" th:data-shipping="${shippingFee}"><h4 class="mb-4">Đơn hàng của bạn</h4>
<div th:each="item:${cartItems}" class="d-flex mb-3 pb-3 border-bottom" th:with="price=${variantPrices.get(item.variantId)}"><div class="flex-grow-1"><h6><a th:href="@{/products/{id}(id=${item.productId})}" th:text="${item.productName}"></a></h6><small>Size: <span th:text="${item.size}"></span> · Số lượng: <span th:text="${item.quantity}"></span></small><div class="fw-bold" th:text="${@money.format(item.price)}+' đ'"></div><del th:if="${price.hasPromotion}" th:text="${@money.format(price.originalPrice)}+' đ'"></del><span class="badge bg-danger ms-2" th:if="${price.hasPromotion}" th:text="${@nhan.text('ui.009')}+${price.discountPercentage}+'%'"></span></div></div>
<label for="voucherCodeInput" class="form-label">Mã voucher</label><div class="input-group"><input class="form-control" id="voucherCodeInput" th:field="*{voucherCode}" maxlength="50" placeholder="Nhập mã"><button class="btn btn-secondary" type="button" data-apply-voucher>Áp dụng</button></div><p id="voucherMessage" data-voucher-message role="status" class="small mt-2"></p>
<div class="d-flex justify-content-between my-3"><span>Tạm tính</span><strong id="displaySubTotal" data-subtotal th:data-subtotal="${subTotal}" th:text="${@money.format(subTotal)}+' đ'"></strong></div><div data-discount-row hidden><span>Giảm voucher: </span><strong id="displayDiscount" data-discount class="text-success"></strong></div><div class="d-flex justify-content-between my-3"><span>Phí giao hàng</span><span th:text="${@money.format(shippingFee)}+' đ'"></span></div><div class="d-flex justify-content-between my-3"><strong>Tổng cộng</strong><strong id="displayTotal" data-total class="text-danger" th:text="${@money.format(total)}+' đ'"></strong></div><p class="small text-muted">Giá và lượt voucher được kiểm tra lại khi đặt hàng.</p><button id="btnPlaceOrder" type="submit" class="btn btn-primary w-100">Đặt hàng</button></div></div></div></form>
<script src="/js/xem-truoc-voucher.js" defer></script><script src="/js/thanh-toan.js" defer></script></div></body></html>
