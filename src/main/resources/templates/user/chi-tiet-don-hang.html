<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/bo-cuc/bo-cuc-nguoi-dung :: html}"><body><div th:fragment="content" class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <h2>Chi tiết Đơn Hàng <span class="text-primary" th:text="${order.orderCode}"></span></h2>
        <a href="/orders" class="btn btn-outline-secondary">Quay lại danh sách</a>
    </div>

    <div class="row">
        <div class="col-md-4">
            <div class="p-3 border rounded bg-light shadow-sm">
                <h5>Thông tin nhận hàng</h5>
                <p class="mb-1"><strong>Người nhận:</strong> <span th:text="${order.receiverName}"></span></p>
                <p class="mb-1"><strong>SĐT:</strong> <span th:text="${order.phoneNumber}"></span></p>
                <p class="mb-1"><strong>Địa chỉ:</strong> <span th:text="${order.shippingAddress}"></span></p>
                <hr>
                <p class="mb-1"><strong>Ngày đặt:</strong> <span th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}"></span></p>
                <p class="mb-1"><strong>Trạng thái:</strong> <span class="badge bg-primary" th:text="${order.status}"></span></p>
            </div>
        </div>

        <div class="col-md-8">
            <div class="p-3 border rounded shadow-sm bg-white">
                <h5>Sản phẩm đã mua</h5>
                <div class="table-responsive"><table class="table mt-3">
                    <thead>
                        <tr>
                            <th>Sản phẩm</th>
                            <th>Size</th>
                            <th>Số lượng</th>
                            <th>Đơn giá</th>
                            <th class="text-end">Thành tiền</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="detail : ${orderDetails}">
                            <td th:text="${detail.productName != null ? detail.productName : detail.productVariant.product.name}"></td>
                            <td th:text="${detail.sizeName != null ? detail.sizeName : detail.productVariant.size.sizeValue}"></td>
                            <td th:text="${detail.quantity}"></td>
                            <td th:text="${@money.format(detail.price)} + ' đ'"></td>
                            <td class="text-end fw-bold" th:text="${@money.format(detail.totalPrice)} + ' đ'"></td>
                        </tr>
                    </tbody>
                    <tfoot>
                        <tr>
                            <td colspan="4" class="text-end fw-bold">Tổng cộng:</td>
                            <td class="text-end fw-bold text-danger fs-5" th:text="${@money.format(order.finalAmount)} + ' đ'"></td>
                        </tr>
                    </tfoot>
                </table></div>
            </div>
        </div>
    </div>
</div>
</body></html>
