<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/user-layout :: html}">
<head>
    <title>Thanh ToÃ¡n</title>
</head>
<body>
    <div th:fragment="content" class="container my-5">
        <h2 class="mb-4 fw-bold">Thanh ToÃ¡n</h2>
        
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        
        <form th:action="@{/checkout/place}" th:object="${checkoutRequest}" method="post" id="checkoutForm">
            <div class="row g-5">
                <!-- Cá»™t trÃ¡i: ThÃ´ng tin -->
                <div class="col-12 col-lg-7">
                    <h4 class="mb-3">ThÃ´ng tin nháº­n hÃ ng</h4>
                    
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label">Há» tÃªn ngÆ°á»i nháº­n <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{receiverName}" th:classappend="${#fields.hasErrors('receiverName')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('receiverName')}" th:errors="*{receiverName}"></div>
                        </div>
                        
                        <div class="col-md-6">
                            <label class="form-label">Sá»‘ Ä‘iá»‡n thoáº¡i <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{phone}" th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                        </div>
                        
                        <div class="col-md-6">
                            <label class="form-label">Email <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" th:field="*{email}" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>
                        
                        <div class="col-12">
                            <label class="form-label">Äá»‹a chá»‰ giao hÃ ng <span class="text-danger">*</span></label>
                            <textarea class="form-control" rows="3" th:field="*{shippingAddress}" th:classappend="${#fields.hasErrors('shippingAddress')} ? 'is-invalid' : ''"></textarea>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('shippingAddress')}" th:errors="*{shippingAddress}"></div>
                        </div>
                    </div>
                    
                    <h4 class="mb-3 mt-5">PhÆ°Æ¡ng thá»©c thanh toÃ¡n</h4>
                    <div class="invalid-feedback d-block mb-2" th:if="${#fields.hasErrors('paymentMethod')}" th:errors="*{paymentMethod}"></div>
                    
                    <div class="card mb-3">
                        <div class="card-body">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="paymentMethod" id="paymentCOD" value="COD" th:field="*{paymentMethod}" onclick="toggleBankInfo()" checked>
                                <label class="form-check-label fw-bold" for="paymentCOD">
                                    Thanh toÃ¡n khi nháº­n hÃ ng (COD)
                                </label>
                            </div>
                        </div>
                    </div>
                    
                    <div class="card mb-3">
                        <div class="card-body">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="paymentMethod" id="paymentBANK" value="BANK_TRANSFER" th:field="*{paymentMethod}" onclick="toggleBankInfo()">
                                <label class="form-check-label fw-bold" for="paymentBANK">
                                    Chuyá»ƒn khoáº£n ngÃ¢n hÃ ng
                                </label>
                            </div>
                            <div id="bankInfo" class="mt-3 p-3 bg-light rounded" style="display: none;">
                                <p class="mb-1"><strong>NgÃ¢n hÃ ng:</strong> <span th:text="${bankName}"></span></p>
                                <p class="mb-1"><strong>Sá»‘ tÃ i khoáº£n:</strong> <span th:text="${bankAccount}"></span></p>
                                <p class="mb-0"><strong>Chá»§ tÃ i khoáº£n:</strong> <span th:text="${bankOwner}"></span></p>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Cá»™t pháº£i: Giá» hÃ ng -->
                <div class="col-12 col-lg-5">
                    <div class="bg-light p-4 rounded shadow-sm">
                        <h4 class="mb-4">ÄÆ¡n hÃ ng cá»§a báº¡n</h4>
                        
                        <div th:each="item : ${cartItems}" class="d-flex mb-3 pb-3 border-bottom">
                            <img th:src="${item.imageUrl}" class="rounded object-fit-cover me-3" style="width: 60px; height: 60px;">
                            <div class="flex-grow-1">
                                <h6 class="mb-0 text-truncate" style="max-width: 200px;" th:text="${item.productName}">Name</h6>
                                <small class="text-muted">Size: <span th:text="${item.sizeName}">39</span> | SL: <span th:text="${item.quantity}">1</span></small>
                                <div class="fw-bold mt-1" th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')} + ' Ä‘'">100k</div>
                            </div>
                        </div>
                        
                        <div class="mb-4 border-bottom pb-4">
                            <label class="form-label">MÃ£ giáº£m giÃ¡</label>
                            <div class="input-group">
                                <input type="text" class="form-control" th:field="*{voucherCode}" id="voucherCodeInput" placeholder="Nháº­p mÃ£">
                                <button type="button" class="btn btn-secondary" onclick="applyVoucher()">Ãp dá»¥ng</button>
                            </div>
                            <div id="voucherMessage" class="mt-2 small"></div>
                        </div>
                        
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Táº¡m tÃ­nh:</span>
                            <span class="fw-bold" id="displaySubTotal" th:attr="data-val=${subTotal}" th:text="${#numbers.formatDecimal(subTotal, 0, 'COMMA', 0, 'POINT')} + ' Ä‘'"></span>
                        </div>
                        
                        <div class="d-flex justify-content-between mb-2" id="discountRow" style="display: none !important;">
                            <span class="text-muted">Giáº£m giÃ¡:</span>
                            <span class="text-success fw-bold" id="displayDiscount">- 0 Ä‘</span>
                        </div>
                        
                        <div class="d-flex justify-content-between mb-3 border-bottom pb-3">
                            <span class="text-muted">PhÃ­ giao hÃ ng:</span>
                            <span th:if="${shippingFee == 0}" class="text-success fw-bold">Miá»…n phÃ­</span>
                            <span th:if="${shippingFee > 0}" class="fw-bold" th:text="${#numbers.formatDecimal(shippingFee, 0, 'COMMA', 0, 'POINT')} + ' Ä‘'"></span>
                            <input type="hidden" id="valShippingFee" th:value="${shippingFee}">
                        </div>
                        
                        <div class="d-flex justify-content-between mb-4 align-items-center">
                            <span class="fw-bold fs-5">Tá»•ng cá»™ng:</span>
                            <span class="text-danger fw-bolder fs-4" id="displayTotal" th:text="${#numbers.formatDecimal(total, 0, 'COMMA', 0, 'POINT')} + ' Ä‘'"></span>
                        </div>
                        
                        <button type="submit" id="btnPlaceOrder" class="btn btn-primary w-100 py-3 fw-bold rounded-pill">Äáº¶T HÃ€NG</button>
                    </div>
                </div>
            </div>
        </form>
        
        <script>
            function toggleBankInfo() {
                var method = document.querySelector('input[name="paymentMethod"]:checked');
                var bankInfo = document.getElementById('bankInfo');
                if (method && method.value === 'BANK_TRANSFER') {
                    bankInfo.style.display = 'block';
                } else {
                    bankInfo.style.display = 'none';
                }
            }
            
            document.addEventListener("DOMContentLoaded", toggleBankInfo);
            
            function applyVoucher() {
                var code = document.getElementById('voucherCodeInput').value.trim();
                var msgDiv = document.getElementById('voucherMessage');
                if (!code) {
                    msgDiv.innerHTML = '<span class="text-danger">Vui lÃ²ng nháº­p mÃ£</span>';
                    return;
                }
                
                var csrfToken = document.querySelector("meta[name='_csrf']").getAttribute("content");
                var csrfHeader = document.querySelector("meta[name='_csrf_header']").getAttribute("content");
                
                var formData = new URLSearchParams();
                formData.append('code', code);
                
                fetch('/checkout/validate-voucher-ajax', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        [csrfHeader]: csrfToken
                    },
                    body: formData
                })
                .then(res => res.json())
                .then(data => {
                    if (data.valid) {
                        msgDiv.innerHTML = '<span class="text-success"><i class="bi bi-check-circle"></i> ' + data.message + '</span>';
                        
                        var subTotal = parseFloat(document.getElementById('displaySubTotal').getAttribute('data-val'));
                        var shipping = parseFloat(document.getElementById('valShippingFee').value);
                        var discount = parseFloat(data.discountAmount);
                        
                        var total = subTotal - discount + shipping;
                        
                        document.getElementById('discountRow').style.setProperty('display', 'flex', 'important');
                        document.getElementById('displayDiscount').innerText = '- ' + new Intl.NumberFormat('en-US').format(discount) + ' Ä‘';
                        document.getElementById('displayTotal').innerText = new Intl.NumberFormat('en-US').format(total) + ' Ä‘';
                    } else {
                        msgDiv.innerHTML = '<span class="text-danger"><i class="bi bi-x-circle"></i> ' + data.message + '</span>';
                        
                        var subTotal = parseFloat(document.getElementById('displaySubTotal').getAttribute('data-val'));
                        var shipping = parseFloat(document.getElementById('valShippingFee').value);
                        var total = subTotal + shipping;
                        
                        document.getElementById('discountRow').style.setProperty('display', 'none', 'important');
                        document.getElementById('displayTotal').innerText = new Intl.NumberFormat('en-US').format(total) + ' Ä‘';
                    }
                });
            }
            
            document.getElementById('checkoutForm').addEventListener('submit', function(e) {
                var btn = document.getElementById('btnPlaceOrder');
                if (btn.disabled) {
                    e.preventDefault();
                    return;
                }
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Äang xá»­ lÃ½...';
            });
        </script>
    </div>
</body>
</html>
