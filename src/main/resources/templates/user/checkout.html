<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thanh toán | SHOP GIÀY</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/">SHOP GIÀY</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/">Trang chủ</a></li>
                <li class="nav-item"><a class="nav-link" href="/products">Sản phẩm</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2 class="mb-4">Thông tin giao hàng</h2>
    
    <div th:if="${param.error != null}" class="alert alert-danger" th:text="${param.error}"></div>

    <div class="row">
        <div class="col-md-7">
            <form th:action="@{/orders/checkout}" th:object="${checkoutRequest}" method="post" class="p-4 border rounded bg-white shadow-sm">
                <h5 class="mb-3">Chi tiết người nhận</h5>
                <div class="mb-3">
                    <label class="form-label">Họ và tên</label>
                    <input type="text" th:field="*{customerName}" class="form-control" placeholder="Nguyễn Văn A">
                    <div class="text-danger" th:if="${#fields.hasErrors('customerName')}" th:errors="*{customerName}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Số điện thoại</label>
                    <input type="text" th:field="*{phoneNumber}" class="form-control" placeholder="0901234567">
                    <div class="text-danger" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Địa chỉ giao hàng</label>
                    <textarea th:field="*{shippingAddress}" class="form-control" rows="3" placeholder="Số nhà, đường..."></textarea>
                    <div class="text-danger" th:if="${#fields.hasErrors('shippingAddress')}" th:errors="*{shippingAddress}"></div>
                </div>
                
                <h5 class="mb-3 mt-4">Phương thức thanh toán</h5>
                <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" th:field="*{paymentMethod}" value="CASH" id="cash" checked>
                    <label class="form-check-label" for="cash">
                        Thanh toán khi nhận hàng (COD)
                    </label>
                </div>
                <div class="form-check mb-4">
                    <input class="form-check-input" type="radio" th:field="*{paymentMethod}" value="TRANSFER" id="transfer">
                    <label class="form-check-label" for="transfer">
                        Chuyển khoản ngân hàng
                    </label>
                </div>
                
                <button type="submit" class="btn btn-success btn-lg w-100">Xác nhận đặt hàng</button>
            </form>
        </div>
        
        <div class="col-md-5">
            <div class="p-4 border rounded bg-light shadow-sm">
                <h5 class="mb-3">Đơn hàng của bạn</h5>
                <ul class="list-group mb-3">
                    <li class="list-group-item d-flex justify-content-between lh-sm" th:each="item : ${cart}">
                        <div>
                            <h6 class="my-0" th:text="${item.productName}">Tên giày</h6>
                            <small class="text-muted" th:text="'Size: ' + ${item.size} + ' | SL: ' + ${item.quantity}"></small>
                        </div>
                        <span class="text-muted" th:text="${#numbers.formatDecimal(item.totalPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between">
                        <span>Phí vận chuyển</span>
                        <strong>0 đ</strong>
                    </li>
                    <li class="list-group-item d-flex justify-content-between bg-white">
                        <strong class="fs-5">Tổng cộng (VND)</strong>
                        <strong class="fs-5 text-danger" th:text="${#numbers.formatDecimal(total, 0, 'COMMA', 0, 'POINT')} + ' đ'"></strong>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>
</body>
</html>
