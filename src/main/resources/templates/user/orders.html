<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Đơn hàng của tôi | SHOP GIÀY</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/">👟 SHOP GIÀY</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/">Trang chủ</a></li>
                <li class="nav-item"><a class="nav-link" href="/products">Sản phẩm</a></li>
            </ul>
            <div class="d-flex">
                <a href="/cart" class="btn btn-outline-dark me-2">Giỏ hàng</a>
                <a href="/orders" class="btn btn-dark me-2">Đơn hàng của tôi</a>
            </div>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2 class="mb-4">Lịch sử Đơn Hàng</h2>
    <div class="bg-white p-4 shadow-sm border rounded">
        <table class="table table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th>Mã Đơn Hàng</th>
                    <th>Ngày đặt</th>
                    <th>Tổng tiền</th>
                    <th>Trạng thái</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="order : ${orders}" th:if="${order.orderType == 'ONLINE'}">
                    <td th:text="${order.orderCode}"></td>
                    <td th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                    <td class="text-danger fw-bold" th:text="${#numbers.formatDecimal(order.finalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                    <td>
                        <span class="badge bg-primary" th:text="${order.status}"></span>
                    </td>
                    <td>
                        <a th:href="@{/orders/{id}(id=${order.id})}" class="btn btn-sm btn-outline-info">Xem chi tiết</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
