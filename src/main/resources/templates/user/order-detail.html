<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Chi tiết đơn hàng | SHOP GIÀY</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/">👟 SHOP GIÀY</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/">Trang chủ</a></li>
                <li class="nav-item"><a class="nav-link" href="/products">Sản phẩm</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Chi tiết Đơn Hàng <span class="text-primary" th:text="${order.orderCode}"></span></h2>
        <a href="/orders" class="btn btn-outline-secondary">Quay lại danh sách</a>
    </div>

    <div class="row">
        <div class="col-md-4">
            <div class="p-3 border rounded bg-light shadow-sm">
                <h5>Thông tin nhận hàng</h5>
                <p class="mb-1"><strong>Người nhận:</strong> <span th:text="${order.customerName}"></span></p>
                <p class="mb-1"><strong>SĐT:</strong> <span th:text="${order.phoneNumber}"></span></p>
                <p class="mb-1"><strong>Địa chỉ:</strong> <span th:text="${order.shippingAddress}"></span></p>
                <hr>
                <p class="mb-1"><strong>Ngày đặt:</strong> <span th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}"></span></p>
                <p class="mb-1"><strong>Trạng thái:</strong> <span class="badge bg-primary" th:text="${order.status}"></span></p>
            </div>
        </div>
        
        <div class="col-md-8">
            <div class="p-3 border rounded shadow-sm bg-white">
                <h5>Sản phẩm đã mua</h5>
                <table class="table mt-3">
                    <thead>
                        <tr>
                            <th>Sản phẩm</th>
                            <th>Size</th>
                            <th>Số lượng</th>
                            <th>Đơn giá</th>
                            <th class="text-end">Thành tiền</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="detail : ${orderDetails}">
                            <td th:text="${detail.productVariant.product.name}"></td>
                            <td th:text="${detail.productVariant.size.sizeValue}"></td>
                            <td th:text="${detail.quantity}"></td>
                            <td th:text="${#numbers.formatDecimal(detail.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                            <td class="text-end fw-bold" th:text="${#numbers.formatDecimal(detail.totalPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                        </tr>
                    </tbody>
                    <tfoot>
                        <tr>
                            <td colspan="4" class="text-end fw-bold">Tổng cộng:</td>
                            <td class="text-end fw-bold text-danger fs-5" th:text="${#numbers.formatDecimal(order.finalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
