<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${adminTitle} + ' | ShoeAdmin'">ShoeAdmin</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/admin-mark.svg}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/design-system.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <script th:src="@{/js/admin.js}" defer></script>
    <script th:src="@{/js/admin-catalog.js}" defer></script>
</head>
<body class="admin-body">
<dialog id="admin-confirm" class="catalog-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-description">
    <h2 id="confirm-title">Xác nhận thao tác</h2><p id="confirm-description"></p>
    <div class="catalog-form-actions"><button type="button" class="btn btn-outline-secondary" data-dialog-cancel autofocus>Hủy</button><button type="button" class="btn btn-danger" data-dialog-accept>Xóa</button></div>
</dialog>
<a class="admin-skip" href="#admin-content">Đến nội dung chính</a>
<aside th:replace="~{fragments/admin-sidebar :: sidebar}"></aside>
<button class="admin-backdrop" aria-label="Đóng menu" tabindex="-1" hidden></button>
<div class="admin-shell">
    <header th:replace="~{fragments/admin-topbar :: topbar}"></header>
    <main id="admin-content" class="admin-content" tabindex="-1">
        <nav th:replace="~{fragments/admin-breadcrumb :: breadcrumb}"></nav>
        <div th:replace="~{fragments/admin-flash :: flash}"></div>
        <th:block th:replace="${content}"></th:block>
    </main>
    <footer class="admin-footer">ShoeAdmin · Không gian quản trị cửa hàng</footer>
</div>
</body>
</html>
